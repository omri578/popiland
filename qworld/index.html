<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>קיו וורלד – איי איקיו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="world"></canvas>

<div id="hud" class="hidden">
  <div class="hud-top">
    <button class="profile-chip" id="hudProfile" title="התיק שלי">
      <img id="hudAvatar" alt="">
      <div class="pc-info">
        <b id="hudName"></b>
        <div class="lvl-row"><span class="lvl">⭐ <span id="hudLvl">1</span></span><div class="xpbar"><i id="hudXp"></i><span id="hudXpTxt"></span></div></div>
      </div>
    </button>
    <div class="zone-pill" id="hudZone"></div>
    <div class="coins-pill" id="hudCoins" title="מטבעות"><span class="coin-ico">🪙</span><b id="hudCoinsVal" data-v="0">0</b></div>
  </div>
  <nav class="hud-side" id="hudSide">
    <button data-act="map"><span>🗺️</span><small>מפה</small></button>
    <button data-act="bag"><span>🎒</span><small>התיק</small></button>
    <button data-act="quests"><span>⭐</span><small>משימות</small></button>
    <button data-act="friends"><span>👫</span><small>חברים</small></button>
    <button data-act="home"><span>🏠</span><small>הבית</small></button>
    <button data-act="emote"><span>😊</span><small>רגשות</small></button>
    <button data-act="dance"><span>💃</span><small>ריקודים</small></button>
    <button data-act="settings"><span>⚙️</span><small>הגדרות</small></button>
  </nav>
  <div class="hud-bottom">
    <div id="chatlog"></div>
    <form id="chatForm" autocomplete="off">
      <button type="button" id="emoteBtn" title="רגשות">😊</button>
      <button type="button" id="quickBtn" title="הודעות מהירות">💬</button>
      <input id="chatInput" maxlength="80" placeholder="כתבו הודעה לכולם... (Enter)">
      <button type="submit" class="send">שליחה</button>
    </form>
  </div>
</div>

<div id="screens"></div>
<div id="modals"></div>
<div id="toasts"></div>
<div id="fxLayer"></div>
<div id="fade"><div class="fade-card"><span id="fadeIcon"></span><b id="fadeName"></b></div></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/avatar.js"></script>
<script src="js/furniture.js"></script>
<script src="js/scenery.js"></script>
<script src="js/zones.js"></script>
<script src="js/islands.js"></script>
<script src="js/storage.js"></script>
<script src="js/econ.js"></script>
<script src="js/world.js"></script>
<script src="js/acts.js"></script>
<script src="js/ui.js"></script>
<script src="js/house.js"></script>
<script src="js/games.js"></script>
<script src="js/net.js"></script>
<script src="js/edu.js"></script>
<script src="js/mystery.js"></script>
<script src="js/main.js"></script>
</body>
</html>
